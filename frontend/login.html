<!-- frontend/login.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sisfeira - Login e Cadastro</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .auth-container {
      width: 100%;
      max-width: 400px;
    }
    .auth-title {
      text-align: center;
      color: var(--cor-primaria);
      margin-bottom: 20px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container auth-container">
  <h1 class="auth-title">Sisfeira</h1>
  
  <div class="card">
    <div class="tab-nav">
      <button class="tab-btn active" id="btnTabLogin" onclick="switchTab('login')">Entrar</button>
      <button class="tab-btn" id="btnTabCadastro" onclick="switchTab('cadastro')">Criar Conta</button>
    </div>

    <div id="alertMessage" class="alert"></div>

    <!-- Formulário de Login -->
    <form id="formLogin">
      <div class="form-group">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="loginSenha">Senha</label>
        <input type="password" id="loginSenha" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%" id="btnSubmitLogin">Entrar</button>
    </form>

    <!-- Formulário de Cadastro -->
    <form id="formCadastro" class="hidden">
      <div class="form-group">
        <label for="cadNome">Nome Completo</label>
        <input type="text" id="cadNome" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="cadEmail">E-mail</label>
        <input type="email" id="cadEmail" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="cadSenha">Senha</label>
        <input type="password" id="cadSenha" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="cadPerfil">Perfil</label>
        <select id="cadPerfil" class="form-control" required onchange="toggleTelefone()">
          <option value="CLIENTE">Cliente</option>
          <option value="PRODUTOR">Produtor</option>
        </select>
      </div>
      <div class="form-group hidden" id="grupoTelefone">
        <label for="cadTelefone">Telefone (Obrigatório para produtor)</label>
        <input type="text" id="cadTelefone" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%" id="btnSubmitCadastro">Cadastrar</button>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  function switchTab(tab) {
    document.getElementById('alertMessage').style.display = 'none';
    
    if (tab === 'login') {
      document.getElementById('btnTabLogin').classList.add('active');
      document.getElementById('btnTabCadastro').classList.remove('active');
      document.getElementById('formLogin').classList.remove('hidden');
      document.getElementById('formCadastro').classList.add('hidden');
    } else {
      document.getElementById('btnTabLogin').classList.remove('active');
      document.getElementById('btnTabCadastro').classList.add('active');
      document.getElementById('formLogin').classList.add('hidden');
      document.getElementById('formCadastro').classList.remove('hidden');
    }
  }

  function toggleTelefone() {
    const perfil = document.getElementById('cadPerfil').value;
    const grupoTel = document.getElementById('grupoTelefone');
    const inputTel = document.getElementById('cadTelefone');
    
    if (perfil === 'PRODUTOR') {
      grupoTel.classList.remove('hidden');
      inputTel.required = true;
    } else {
      grupoTel.classList.add('hidden');
      inputTel.required = false;
      inputTel.value = '';
    }
  }

  function showMessage(msg, isError = true) {
    const alertDiv = document.getElementById('alertMessage');
    alertDiv.textContent = msg;
    alertDiv.className = isError ? 'alert alert-error' : 'alert alert-success';
    alertDiv.style.display = 'block';
  }

  document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnSubmitLogin');
    btn.classList.add('btn-loading');
    btn.textContent = 'Aguarde...';
    document.getElementById('alertMessage').style.display = 'none';

    const payload = {
      email: document.getElementById('loginEmail').value,
      senha: document.getElementById('loginSenha').value
    };

    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: payload
      });
      
      salvarSessao(data.token, data.usuario);
      
      if (data.usuario.perfil === 'PRODUTOR' || data.usuario.perfil === 'ORGANIZACAO') {
        window.location.href = '/painel-produtor.html';
      } else {
        window.location.href = '/index.html';
      }
    } catch (error) {
      showMessage(error.mensagem || 'Erro ao realizar login.');
    } finally {
      btn.classList.remove('btn-loading');
      btn.textContent = 'Entrar';
    }
  });

  document.getElementById('formCadastro').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnSubmitCadastro');
    btn.classList.add('btn-loading');
    btn.textContent = 'Aguarde...';
    document.getElementById('alertMessage').style.display = 'none';

    const payload = {
      nome: document.getElementById('cadNome').value,
      email: document.getElementById('cadEmail').value,
      senha: document.getElementById('cadSenha').value,
      perfil: document.getElementById('cadPerfil').value,
      telefone: document.getElementById('cadTelefone').value || undefined
    };

    try {
      await apiFetch('/auth/cadastro', {
        method: 'POST',
        body: payload
      });
      
      showMessage('Cadastro realizado com sucesso! Faça login para continuar.', false);
      document.getElementById('formCadastro').reset();
      toggleTelefone();
      setTimeout(() => switchTab('login'), 2000);
    } catch (error) {
      showMessage(error.mensagem || 'Erro ao realizar cadastro.');
    } finally {
      btn.classList.remove('btn-loading');
      btn.textContent = 'Cadastrar';
    }
  });
</script>
</body>
</html>
